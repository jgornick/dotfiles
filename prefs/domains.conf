# Tracked preference domains — the single list read by both export.sh and the
# chezmoi import hook (.chezmoiscripts/run_onchange_darwin-import-prefs.sh.tmpl).
#
# One domain per line:  <defaults domain>|<app process to restart on import>
# Leave the app blank when nothing needs restarting (system domains).
# Add entries with `./export.sh --add <domain> [app]`, which also prints the
# domain's keys for a secrets review before the first export.
#
# "monosnap" is a pseudo-domain: Monosnap stores JSON in its container rather
# than using the defaults system.
